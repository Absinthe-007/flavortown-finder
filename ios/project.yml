name: FlavortownFinder
options:
  bundleIdPrefix: com.absinthe007
  deploymentTarget:
    iOS: "17.0"
targets:
  FlavortownFinder:
    type: application
    platform: iOS
    sources: [FlavortownFinder]
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.absinthe007.flavortownfinder
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Flavortown
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Finds Triple D spots near you and starts trips from where you are."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
