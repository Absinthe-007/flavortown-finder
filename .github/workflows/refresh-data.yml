name: Refresh restaurant data

on:
  schedule:
    - cron: "17 9 * * *"   # daily ~4am Central — Google usage is capped to stay inside the free monthly tiers
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PRO_MONTHLY_CAP: ${{ vars.GOOGLE_PRO_MONTHLY_CAP }}
          GOOGLE_ENTERPRISE_MONTHLY_CAP: ${{ vars.GOOGLE_ENTERPRISE_MONTHLY_CAP }}
          GOOGLE_RATINGS_PER_DAY: ${{ vars.GOOGLE_RATINGS_PER_DAY }}
          RECIPE_BUDGET: "150"
        run: python scripts/build_data.py
      - name: Commit changes
        run: |
          git config user.name "flavortown-bot"
          git config user.email "flavortown-bot@users.noreply.github.com"
          git add docs/data data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Refresh DDD data $(date -u +%Y-%m-%d)"
          git push
